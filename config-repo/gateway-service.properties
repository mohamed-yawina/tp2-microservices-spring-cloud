
# ==========================================
# GATEWAY SERVICE - CONFIGURATION CENTRALISEE
# ==========================================

# Port du microservice
server.port=8888

# ==========================================
# EUREKA DISCOVERY CLIENT
# ==========================================

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# ==========================================
# DECOUVERTE AUTOMATIQUE DES ROUTES
# ==========================================

spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# ==========================================
# ROUTES VIA EUREKA ET LOADBALANCER
# ==========================================

# Route Customer Service
spring.cloud.gateway.routes[0].id=customer-service
spring.cloud.gateway.routes[0].uri=lb://CUSTOMER-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/customers,/customers/**

# Route Inventory Service
spring.cloud.gateway.routes[1].id=inventory-service
spring.cloud.gateway.routes[1].uri=lb://INVENTORY-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/products,/products/**

# Route Billing Service
spring.cloud.gateway.routes[2].id=billing-service
spring.cloud.gateway.routes[2].uri=lb://BILLING-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/bills,/bills/**

# ==========================================
# SPRING BOOT ACTUATOR
# ==========================================

management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.gateway.enabled=true

# ==========================================
# PROPRIETE DE TEST
# ==========================================

app.message=Gateway Service configure depuis Config Server
